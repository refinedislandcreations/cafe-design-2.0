<!-- Full Overlay Mobile Menu -->

  id="mobile-menu"
  aria-modal="true"
  aria-label="Main menu"
  role="dialog"
>
  <!-- Mobile menu header -->
  <div class="flex items-center justify-between p-4 border-b border-[#3c2a21]">
    <a
      href="/"
      class="flex items-center focus:outline-none focus:ring-2 focus:ring-[#d4a574] rounded"

    >
      <img
        src="/images/rise-and-grind-logo-optimized.png"
        alt="Rise & Grind Logo"

        width="auto"
        height="auto"
      />
    </a>
    <button

      >

        />

  <!-- Mobile menu links -->

    <nav
      class="flex flex-col space-y-8 w-full max-w-sm px-4 text-center"
      aria-label="Mobile navigation"
    >
      <a
        href="#"

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const navbar = document.getElementById("navbar");
    const hamburgerButton = document.getElementById("hamburger-button");
    const closeButton = document.getElementById("close-button");
    const mobileMenu = document.getElementById("mobile-menu");
    const mobileNavLinks = document.querySelectorAll(".mobile-nav-link");

    // Navbar scroll effect
    function handleScroll() {
      if (window.scrollY > 30) {
        navbar.classList.add("bg-opacity-95", "shadow-lg", "py-2");
        navbar.classList.remove("bg-opacity-90", "py-3", "md:py-4");
      } else {
        navbar.classList.remove("bg-opacity-95", "shadow-lg", "py-2");
        navbar.classList.add("bg-opacity-90", "py-3", "md:py-4");
      }
    }

    // Mobile menu functions
    function openMobileMenu() {
      mobileMenu.classList.remove("translate-y-full");
      document.body.style.overflow = "hidden";
      hamburgerButton.setAttribute("aria-expanded", "true");
      closeButton.focus();
    }

    function closeMobileMenu() {
      mobileMenu.classList.add("translate-y-full");
      document.body.style.overflow = "";
      hamburgerButton.setAttribute("aria-expanded", "false");
      hamburgerButton.focus();
    }

    // Event listeners
    window.addEventListener("scroll", handleScroll);

    hamburgerButton.addEventListener("click", openMobileMenu);
    closeButton.addEventListener("click", closeMobileMenu);

    // Close mobile menu when clicking on links
    mobileNavLinks.forEach((link) => {
      link.addEventListener("click", closeMobileMenu);
    });

    // Close mobile menu on escape key
    document.addEventListener("keydown", function (e) {
      if (
        e.key === "Escape" &&
        !mobileMenu.classList.contains("translate-y-full")
      ) {
        closeMobileMenu();
      }
    });

    // Trap focus inside mobile menu when open
    document.addEventListener("keydown", function (e) {
      if (
        e.key === "Tab" &&
        !mobileMenu.classList.contains("translate-y-full")
      ) {
        const focusableElements = mobileMenu.querySelectorAll(
          'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        );
        const firstElement = focusableElements[0];
        const lastElement = focusableElements[focusableElements.length - 1];

        if (e.shiftKey) {
          if (document.activeElement === firstElement) {
            lastElement.focus();
            e.preventDefault();
          }
        } else {
          if (document.activeElement === lastElement) {
            firstElement.focus();
            e.preventDefault();
          }
        }
      }
    });

    // Initialize scroll state
    handleScroll();
  });
</script>

<style>
  /* Custom styles for hover effects */
  .nav-link::after {
    content: "";
    position: absolute;
    width: 0;
    height: 2px;
    bottom: 0;
    left: 0;
    background-color: #d4a574;
    transition: width 0.3s ease;
  }

  .nav-link:hover::after,
  .nav-link:focus::after {
    width: 100%;
  }

  /* Improved focus styles for better accessibility */
  .nav-link:focus {
    outline: none;
  }

  .nav-link:focus-visible {
    outline: 2px solid #d4a574;
    outline-offset: 2px;
    border-radius: 2px;
  }
</style>
