<section
  id="coffee-section"
  class="coffee-parallax relative pt-12 md:pt-16 lg:pt-24 overflow-hidden"
>
  <div class="max-w-7xl mx-auto px-4 xs:px-6 sm:px-8 lg:px-12 xl:px-16">
    <!-- Image -->
    <div
      class="parallax-image-container flex justify-center lg:justify-end mb-6 sm:mb-8 md:mb-10 lg:mb-12 relative overflow-visible"
    >
      <div
        class="relative aspect-square w-48 xs:w-56 sm:w-64 md:w-72 lg:w-80 xl:w-[26rem] -mt-8 sm:-mt-10 md:-mt-12 lg:-mt-16 xl:-mt-20 overflow-visible"
      >
        <div
          class="absolute top-0 right-0 w-full h-full bg-[#5b4432] rounded-full z-0 translate-x-[4%] sm:translate-x-[5%] lg:translate-x-[6%] -translate-y-[3%] sm:-translate-y-[4%]"
        ></div>
        <div
          class="parallax-image relative rounded-full overflow-hidden shadow-xl sm:shadow-2xl w-full h-full z-10"
        >
          <img
            src="{{ include.section.image }}"
            alt="{{ include.section.heading_main }}"
            class="w-full h-full object-cover"
          />
        </div>
      </div>
    </div>

    <!-- Text Content - Flex Layout with Tailwind -->
    <div
      class="parallax-content flex flex-col lg:flex-row gap-6 lg:gap-10 xl:gap-12 md:-mt-16 lg:-mt-24 xl:-mt-32"
    >
      <!-- Main Content Column -->
      <div class="flex flex-col gap-6 lg:flex-[2]">
        <!-- Header Section -->
        <div class="space-y-3 sm:space-y-4">
          <span
            class="block text-base sm:text-lg md:text-xl lg:text-2xl xl:text-3xl font-semibold text-gray-600 tracking-wide leading-tight"
          >
            {{ include.section.heading_top }}
          </span>
          <h1
            class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-bold text-gray-900 leading-tight sm:leading-tight md:leading-tight lg:leading-none tracking-tight"
          >
            {{ include.section.heading_main }}
          </h1>
        </div>

        <!-- Paragraphs Section -->
        <div class="space-y-6 sm:space-y-8">
          <div>
            <p
              class="text-sm sm:text-base md:text-lg lg:text-xl leading-relaxed sm:leading-loose text-gray-700 font-normal"
            >
              {{ include.section.paragraph_1 }}
            </p>
          </div>

          <div>
            <p
              class="text-sm sm:text-base md:text-lg lg:text-xl leading-relaxed sm:leading-loose text-gray-700 font-normal"
            >
              {{ include.section.paragraph_2 }}
            </p>
          </div>
        </div>
      </div>

      <!-- Side Content Column - Now properly bottom-aligned -->
      <div class="flex items-start lg:items-end lg:justify-end lg:flex-1">
        <p
          class="text-sm sm:text-base md:text-lg lg:text-xl leading-relaxed sm:leading-loose text-gray-700 font-normal border-l-3 border-gray-300 lg:self-end"
        >
          {{ include.section.paragraph_3 }}
        </p>
      </div>
    </div>
  </div>
</section>

<script>
  // assets/js/parallax.js
  document.addEventListener("DOMContentLoaded", function () {
    // Check if GSAP is available
    if (typeof gsap !== "undefined" && typeof ScrollTrigger !== "undefined") {
      initParallax();
    } else {
      // If GSAP isn't loaded yet, wait for it
      const checkGSAP = setInterval(() => {
        if (
          typeof gsap !== "undefined" &&
          typeof ScrollTrigger !== "undefined"
        ) {
          clearInterval(checkGSAP);
          initParallax();
        }
      }, 100);
    }

    function initParallax() {
      const coffeeSection = document.querySelector("#coffee-section");

      if (!coffeeSection) return;

      // Register ScrollTrigger plugin
      gsap.registerPlugin(ScrollTrigger);

      // Function to get yPercent based on screen width
      function getYPercent() {
        if (window.innerWidth >= 1024) {
          return -30; // Desktop: 30%
        } else if (window.innerWidth >= 768) {
          return -25; // Tablet: 25%
        } else {
          return -10; // Mobile: 10%
        }
      }

      // Function to get image yPercent based on screen width
      function getImageYPercent() {
        if (window.innerWidth >= 1024) {
          return -10; // Desktop
        } else if (window.innerWidth >= 768) {
          return -8; // Tablet
        } else {
          return -6; // Mobile
        }
      }

      // Function to get content yPercent based on screen width
      function getContentYPercent() {
        if (window.innerWidth >= 1024) {
          return -5; // Desktop
        } else if (window.innerWidth >= 768) {
          return -4; // Tablet
        } else {
          return -3; // Mobile
        }
      }

      // Create parallax animation for the entire section
      gsap.to(coffeeSection, {
        yPercent: getYPercent,
        ease: "none",
        scrollTrigger: {
          trigger: coffeeSection,
          start: "top bottom",
          end: "bottom top",
          scrub: 1,
          markers: false,
        },
      });

      // Additional parallax effect for individual elements
      const parallaxImage = document.querySelector(".parallax-image");
      const parallaxContent = document.querySelector(".parallax-content");

      if (parallaxImage) {
        gsap.to(parallaxImage, {
          yPercent: getImageYPercent,
          ease: "none",
          scrollTrigger: {
            trigger: coffeeSection,
            start: "top bottom",
            end: "bottom top",
            scrub: 1,
          },
        });
      }

      if (parallaxContent) {
        gsap.to(parallaxContent, {
          yPercent: getContentYPercent,
          ease: "none",
          scrollTrigger: {
            trigger: coffeeSection,
            start: "top bottom",
            end: "bottom top",
            scrub: 1,
          },
        });
      }

      // Alternative approach using media queries with ScrollTrigger's matchMedia
      // This is cleaner and more efficient
      ScrollTrigger.matchMedia({
        // Desktop (1024px and up)
        "(min-width: 1024px)": function () {
          gsap.to(coffeeSection, {
            yPercent: -25,
            ease: "none",
            scrollTrigger: {
              trigger: coffeeSection,
              start: "top bottom",
              end: "bottom top",
              scrub: 1,
              markers: false,
            },
          });
        },
        // Tablet (768px to 1023px)
        "(min-width: 768px) and (max-width: 1023px)": function () {
          gsap.to(coffeeSection, {
            yPercent: -20,
            ease: "none",
            scrollTrigger: {
              trigger: coffeeSection,
              start: "top bottom",
              end: "bottom top",
              scrub: 1,
              markers: false,
            },
          });
        },
        // Mobile (below 768px)
        "(max-width: 767px)": function () {
          gsap.to(coffeeSection, {
            yPercent: -15,
            ease: "none",
            scrollTrigger: {
              trigger: coffeeSection,
              start: "top bottom",
              end: "bottom top",
              scrub: 1,
              markers: false,
            },
          });
        },
      });
    }
  });
</script>
