<section class="relative py-16 md:py-24 bg-white overflow-hidden">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Image -->
    <div
      class="flex justify-center lg:justify-end mb-8 lg:mb-12 relative overflow-visible"
    >
      <div
        class="relative aspect-square w-64 md:w-80 lg:w-[26rem] -mt-12 lg:-mt-20 overflow-visible"
      >
        <div
          class="absolute top-0 right-0 w-full h-full bg-[#5b4432] rounded-full z-0 translate-x-[6%] -translate-y-[4%]"
        ></div>
        <div
          class="relative rounded-full overflow-hidden shadow-2xl w-full h-full z-10"
        >
          <img
            src="{{ include.section.image }}"
            alt="{{ include.section.heading_main }}"
            class="w-full h-full object-cover"
          />
        </div>
      </div>
    </div>

    <!-- Text Content -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-12">
      <div class="space-y-6">
        <div>
          <div class="mb-3">
            <span
              class="text-lg md:text-4xl font-semibold text-gray-600 tracking-wide"
            >
              {{ include.section.heading_top }}
            </span>
          </div>
          <h2
            class="text-4xl md:text-5xl lg:text-6xl font-bold text-gray-900 leading-tight"
          >
            {{ include.section.heading_main }}
          </h2>
        </div>

        <div>
          <p class="text-lg md:text-xl leading-relaxed text-gray-700">
            {{ include.section.paragraph_1 }}
          </p>
        </div>

        <div>
          <p class="text-lg md:text-xl leading-relaxed text-gray-700">
            {{ include.section.paragraph_2 }}
          </p>
        </div>
      </div>

      <div class="flex items-end">
        <p class="text-lg md:text-xl leading-relaxed text-gray-700">
          {{ include.section.paragraph_3 }}
        </p>
      </div>
    </div>
  </div>
</section>
