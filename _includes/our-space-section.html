<section class="relative py-20 md:py-32 bg-[#b39978] overflow-hidden">
  <div class="max-w-7xl mx-auto px-6 sm:px-8 lg:px-12">
    <div class="mb-16 lg:mb-24 max-w-6xl">
      <div class="mb-8">
        <span
          class="text-sm md:text-base font-semibold text-amber-100/80 tracking-wider uppercase mb-4 block"
        >
          {{ include.section.tagline }}
        </span>
        <h2
          class="text-5xl md:text-7xl lg:text-8xl font-bold text-amber-50 mb-4 leading-[0.9]"
        >
          {{ include.section.title }}
        </h2>
        <h3
          class="text-3xl md:text-5xl lg:text-6xl font-light text-amber-200 italic"
        >
          {{ include.section.subtitle }}
        </h3>
      </div>

      <div class="border-l-4 border-amber-200/30 pl-6 md:pl-8">
        <p
          class="text-lg md:text-xl lg:text-2xl text-amber-50/95 leading-relaxed md:leading-loose"
        >
          {{ include.section.description }}
        </p>
      </div>
    </div>

    <!-- Image Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-4 sm:grid-rows-2 gap-4 sm:gap-3">
      {% for image in include.section.images %}
      <div
        class="col-span-1 row-span-1 overflow-hidden relative h-full min-h-40 sm:min-h-[300px] group {% if forloop.first %}col-span-2 row-span-2 min-h-80 sm:min-h-[600px]{% endif %} {% if forloop.index > 1 %}hidden md:block{% endif %}"
      >
        <div
          class="absolute inset-0 w-full h-full transform transition-all duration-500 group-hover:scale-[1.02]"
        >
          <img
            src="{{ image.src }}"
            alt="{{ image.alt }}"
            class="w-full h-full object-cover transform transition-transform duration-700 group-hover:scale-110"
          />
        </div>
      </div>
      {% endfor %}
    </div>

    <!-- Decorative Elements -->
    <div
      class="absolute top-10 left-10 w-20 h-20 bg-amber-200/10 rounded-full blur-xl"
    ></div>
    <div
      class="absolute bottom-10 right-10 w-32 h-32 bg-amber-100/5 rounded-full blur-2xl"
    ></div>
  </div>
</section>
